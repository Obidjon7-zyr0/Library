<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kutubxona{% endblock %} · Library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#173b37;font:16px/1.6 system-ui,sans-serif}a{color:#176b58;text-underline-offset:4px}header{background:white;border-bottom:1px solid #dedfd5}nav{max-width:1100px;margin:auto;padding:22px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}.brand{font-size:23px;font-weight:800;margin-right:auto;text-decoration:none}main{max-width:1100px;margin:48px auto;padding:0 24px;min-height:65vh}h1{font-size:clamp(28px,5vw,44px);line-height:1.2}h2{font-size:22px}.muted{color:#64756e}.heading,.actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.heading{justify-content:space-between}.button,button{display:inline-block;background:#176b58;color:white;padding:11px 18px;border:0;border-radius:9px;text-decoration:none;font:inherit;cursor:pointer}.secondary{background:#e6ece5;color:#173b37}.danger{background:#a53b35}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:28px 0}.card,.panel{background:white;border:1px solid #dedfd5;border-radius:16px;padding:25px}.card h2 a{text-decoration:none}.panel{max-width:700px;margin:25px 0}.badge{display:inline-block;border-radius:30px;background:#e8eee5;padding:4px 11px;font-size:12px}.search{display:flex;gap:10px}.search input{flex:1;min-width:0}input:not([type=checkbox]),select{width:100%;border:1px solid #aebfb4;border-radius:8px;padding:12px;font:inherit;background:white}input[type=checkbox]{width:20px;height:20px}label{display:block;font-weight:600;margin-bottom:8px}.field{margin-bottom:22px}.errorlist,.error{color:#a52d27}.notice{background:#e2f0e8;padding:14px 18px;border-radius:6px;margin:16px 0}.empty{padding:32px;border:1px dashed #aebfb4;border-radius:16px}footer{max-width:1100px;margin:auto;padding:24px;color:#64756e;border-top:1px solid #dedfd5}:focus-visible{outline:3px solid #d49335;outline-offset:3px}@media(max-width:550px){main{margin-top:28px}.brand{width:100%}nav{gap:14px}.search{flex-wrap:wrap}}
</style>
<style>
    :root { --ink: #183b36; --paper: #fffef9; --canvas: #f5f3ec; --line: #dce1d7; --accent: #146b58; --accent-dark: #0d5546; --accent-soft: #e4f0ea; --danger: #a13a36; }
    body { min-width: 320px; color: var(--ink); background: var(--canvas); }
    header { background: var(--paper); border-bottom-color: var(--line); }
    nav { min-height: 82px; gap: 10px 24px; }
    nav > a:not(.brand) { font-weight: 650; text-decoration: none; }
    nav > a:not(.brand):hover { text-decoration: underline; }
    .brand { color: var(--ink); letter-spacing: -.4px; }
    main { min-height: 67vh; margin-top: 46px; margin-bottom: 52px; }
    h1 { margin-bottom: 8px; font-size: clamp(30px, 5vw, 46px); letter-spacing: -1.2px; }
    .button, button { font-weight: 700; transition: background .18s ease, transform .18s ease; }
    .button:hover, button:hover { color: white; background: var(--accent-dark); transform: translateY(-1px); text-decoration: none; }
    .secondary { background: #e3e9e2; }
    .secondary:hover { color: var(--ink); background: #d4dfd4; }
    .danger, .danger:hover { background: var(--danger); }
    .card, .panel { background: var(--paper); border-color: var(--line); box-shadow: 0 8px 26px rgba(24, 59, 54, .04); }
    .card { display: flex; flex-direction: column; min-height: 198px; padding: 24px; }
    .card h2 { margin: 17px 0 7px; }
    .card h2 a { color: var(--ink); }
    .card h2 a:hover { color: var(--accent); }
    .card > a:last-child { margin-top: auto; font-weight: 700; }
    .panel { padding: 26px; }
    .badge { color: #315c4f; background: var(--accent-soft); font-weight: 750; }
    .search { max-width: 720px; margin-top: 26px; }
    input:not([type=checkbox]), select { border-radius: 9px; color: var(--ink); }
    label { font-weight: 700; }
    .notice { border: 1px solid #b8d7c5; border-radius: 10px; background: var(--accent-soft); }
    .empty { color: #64756e; border-color: #9fb6aa; }

    @media (max-width: 550px) {
        nav { padding-top: 18px; padding-bottom: 18px; }
    }
</style>
</head>
<body>
<header><nav aria-label="Asosiy menyu"><a class="brand" href="{% url 'book-page' %}">Library / kutubxona</a><a href="{% url 'book-page' %}">Kitoblar</a><a href="{% url 'author-list-page' %}">Mualliflar</a><a href="/api/books/">API</a><a href="{% url 'admin:index' %}">Admin</a></nav></header>
<main>{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
<footer>Library · Kitoblar va ularni yaratgan insonlar.</footer></body></html>
